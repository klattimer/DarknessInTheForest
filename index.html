<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Dark Forest Galaxy Simulation</title>
  <link rel="stylesheet" href="css/style.css">
  <script type="importmap">
  {
    "imports": {
      "three": "https://unpkg.com/three@0.160.0/build/three.module.js",
      "three/addons/": "https://unpkg.com/three@0.160.0/examples/jsm/"
    }
  }
  </script>
</head>
<body>
  <canvas id="view"></canvas>

  <div id="topbar">
    <button id="btnPlay">Pause</button>
    <button id="btnRegen">Regenerate</button>
    <button id="btnExport">Export JSON</button>
    <button id="btnImport">Import JSON</button>
    <button id="btnReset">Reset defaults</button>
    <input type="file" id="fileImport" accept="application/json,.json" hidden>
  </div>

  <div id="stats"></div>

  <aside id="panel"></aside>

  <script type="module" src="js/main.js"></script>
</body>
</html>
